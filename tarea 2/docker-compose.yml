services:

  redis-cache:
    image: redis:latest
    container_name: redis-cache
    ports:
      - "6380:6379"
    networks:
      - kafka-net

  kafka:
    image: confluentinc/cp-kafka:7.4.1
    container_name: kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: 'broker,controller'
      KAFKA_LISTENERS: 'PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:29093'
      KAFKA_ADVERTISED_LISTENERS: 'PLAINTEXT://kafka:9092'
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: 'CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT'
      KAFKA_INTER_BROKER_LISTENER_NAME: 'PLAINTEXT'
      KAFKA_CONTROLLER_LISTENER_NAMES: 'CONTROLLER'
      KAFKA_CONTROLLER_QUORUM_VOTERS: '1@kafka:29093'
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      CLUSTER_ID: 'MkU3OEVBNTcwNTJENDM2Qk'
      KAFKA_LOG_DIRS: '/tmp/kraft-combined-logs'
    volumes:
      - kafka_data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD", "kafka-broker-api-versions", "--bootstrap-server", "kafka:9092"]
      interval: 10s
      timeout: 10s
      retries: 10
    networks:
      - kafka-net

  kafka-setup:
    image: confluentinc/cp-kafka:7.4.1
    container_name: kafka-setup
    restart: on-failure
    depends_on:
      kafka:
        condition: service_healthy
    command: >
      bash -c "
        sleep 10 &&
        kafka-topics --create --if-not-exists --bootstrap-server kafka:9092 --topic queries       --partitions 4 --replication-factor 1 &&
        kafka-topics --create --if-not-exists --bootstrap-server kafka:9092 --topic queries-retry --partitions 4 --replication-factor 1 &&
        kafka-topics --create --if-not-exists --bootstrap-server kafka:9092 --topic queries-dlq   --partitions 2 --replication-factor 1 &&
        kafka-topics --create --if-not-exists --bootstrap-server kafka:9092 --topic metrics       --partitions 2 --replication-factor 1 &&
        echo '✓ Todos los tópicos creados correctamente' &&
        kafka-topics --list --bootstrap-server kafka:9092
      "
    networks:
      - kafka-net

  generador_trafico:
    build: ./generador_trafico
    container_name: generador_trafico
    depends_on:
      kafka:
        condition: service_healthy
    environment:
      KAFKA_BROKER: kafka:9092
      QUERIES_POR_SEGUNDO: "10"
      DISTRIBUCION: "zipf"
      ZIPF_ALPHA: "1.2"
      DURACION_SEGUNDOS: "120"
    networks:
      - kafka-net

  generador_respuestas:
    build: ./generador_respuestas
    container_name: generador_respuestas
    ports:
      - "8001:8001"
    environment:
      PORT: 8001
      FAILURE_RATE: "0.0"
    networks:
      - kafka-net

  kafka_consumer_1:
    build: ./consumer
    container_name: kafka_consumer_1
    depends_on:
      kafka:
        condition: service_healthy
    environment:
      KAFKA_BROKER: kafka:9092
      REDIS_HOST: redis-cache
      RESPONSE_GENERATOR_URL: http://generador_respuestas:8001
      CONSUMER_ID: consumer-1
      GROUP_ID: query-consumers
      MAX_RETRIES: "3"
    networks:
      - kafka-net

  kafka_consumer_2:
    build: ./consumer
    container_name: kafka_consumer_2
    depends_on:
      kafka:
        condition: service_healthy
    environment:
      KAFKA_BROKER: kafka:9092
      REDIS_HOST: redis-cache
      RESPONSE_GENERATOR_URL: http://generador_respuestas:8001
      CONSUMER_ID: consumer-2
      GROUP_ID: query-consumers
      MAX_RETRIES: "3"
    networks:
      - kafka-net

  topico_reintento:
    build: ./retry
    container_name: topico_reintento
    depends_on:
      kafka:
        condition: service_healthy
    environment:
      KAFKA_BROKER: kafka:9092
      REDIS_HOST: redis-cache
      RESPONSE_GENERATOR_URL: http://generador_respuestas:8001
      MAX_RETRIES: "3"
      RETRY_BASE_DELAY: "2"
    networks:
      - kafka-net

  metrics_service:
    build: ./metricas
    container_name: metricas
    depends_on:
      kafka:
        condition: service_healthy
      kafka-setup:
        condition: service_completed_successfully 
    ports:
      - "8080:8080"
    environment:
      KAFKA_BROKER: kafka:9092
      REDIS_HOST: redis-cache
      PORT: "8080"
    networks:
      - kafka-net

  dlq:
    build: ./dlq
    container_name: dlq
    depends_on:
      kafka:
        condition: service_healthy
    environment:
      KAFKA_BROKER: kafka:9092
      OUTPUT_FILE: /reports/DLQ_reporte.csv
    volumes:
      - ./reports:/reports
    profiles:
      - analysis
    networks:
      - kafka-net

volumes:
  kafka_data:

networks:
  kafka-net:
    driver: bridge